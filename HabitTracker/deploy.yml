name: CI/CD - ASP.NET Core Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore HabitTracker.API/HabitTracker.API.csproj

    - name: Build
      run: dotnet build --configuration Release HabitTracker.API/HabitTracker.API.csproj

    - name: Test
      run: dotnet test --no-build || echo "⚠️ No tests found"

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/habittracker-api:latest ./HabitTracker.API

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/habittracker-api:latest   